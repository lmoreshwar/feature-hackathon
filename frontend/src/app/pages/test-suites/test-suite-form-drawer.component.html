<nz-drawer
  [nzVisible]="visible()"
  [nzTitle]="drawerTitle"
  [nzWidth]="480"
  [nzMaskClosable]="!submitting()"
  [nzClosable]="!submitting()"
  [nzFooter]="footer"
  (nzOnClose)="close()"
>
  <ng-container *nzDrawerContent>
    @if (errorMessage(); as msg) {
      <nz-alert nzType="error" [nzMessage]="msg" nzShowIcon class="drawer-alert"></nz-alert>
    }
    <nz-spin [nzSpinning]="submitting()">
      <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
        <nz-form-item>
          <nz-form-label nzRequired>Feature</nz-form-label>
          <nz-form-control nzErrorTip="Feature is required">
            <nz-select formControlName="featureId" nzPlaceHolder="Select a feature" nzShowSearch>
              @for (f of features; track f._id) {
                <nz-option [nzValue]="f._id" [nzLabel]="f.name"></nz-option>
              }
            </nz-select>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Module name</nz-form-label>
          <nz-form-control nzErrorTip="Module name is required">
            <input nz-input formControlName="moduleName" placeholder="e.g. Login flow" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Description</nz-form-label>
          <nz-form-control>
            <textarea nz-input rows="3" formControlName="description" placeholder="What does this suite cover?"></textarea>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Version</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="version" placeholder="1.0.0" />
          </nz-form-control>
        </nz-form-item>

        @if (isEditing) {
          <nz-form-item>
            <nz-form-label nzRequired>Status</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="status">
                @for (s of statuses; track s) {
                  <nz-option [nzValue]="s" [nzLabel]="s"></nz-option>
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        }

        <nz-form-item>
          <nz-form-label>Jira ID</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="jiraId" placeholder="QA-123" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Confluence URL</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="confluenceUrl" placeholder="https://..." />
          </nz-form-control>
        </nz-form-item>
      </form>
    </nz-spin>
  </ng-container>
</nz-drawer>

<ng-template #footer>
  <div style="text-align: right">
    <button nz-button (click)="close()" [disabled]="submitting()" style="margin-right: 8px">Cancel</button>
    <button
      nz-button
      nzType="primary"
      (click)="submit()"
      [nzLoading]="submitting()"
      [disabled]="form.invalid"
    >
      {{ isEditing ? 'Save changes' : 'Create suite' }}
    </button>
  </div>
</ng-template>
