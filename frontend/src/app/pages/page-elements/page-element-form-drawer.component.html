<nz-drawer
  [nzVisible]="visible()"
  [nzTitle]="drawerTitle"
  [nzWidth]="520"
  [nzMaskClosable]="!submitting()"
  [nzClosable]="!submitting()"
  [nzFooter]="footer"
  (nzOnClose)="close()"
>
  <ng-container *nzDrawerContent>
    @if (errorMessage(); as msg) {
      <nz-alert nzType="error" [nzMessage]="msg" nzShowIcon style="margin-bottom: 12px"></nz-alert>
    }
    <nz-spin [nzSpinning]="submitting()">
      <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
        <nz-form-item>
          <nz-form-label nzRequired>Feature</nz-form-label>
          <nz-form-control nzErrorTip="Feature is required">
            <nz-select formControlName="featureId" nzPlaceHolder="Select a feature" nzShowSearch>
              @for (f of features; track f._id) { <nz-option [nzValue]="f._id" [nzLabel]="f.name"></nz-option> }
            </nz-select>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Page URL</nz-form-label>
          <nz-form-control nzErrorTip="Page URL is required">
            <input nz-input formControlName="pageUrl" placeholder="https://app.example.com/login" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Page name</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="pageName" placeholder="Login" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Element name</nz-form-label>
          <nz-form-control nzErrorTip="Element name is required">
            <input nz-input formControlName="elementName" placeholder="Submit button" />
          </nz-form-control>
        </nz-form-item>

        <div nz-row [nzGutter]="12">
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label nzRequired>Element type</nz-form-label>
              <nz-form-control>
                <nz-select formControlName="elementType">
                  @for (t of elementTypes; track t) { <nz-option [nzValue]="t" [nzLabel]="t"></nz-option> }
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label nzRequired>Selector type</nz-form-label>
              <nz-form-control>
                <nz-select formControlName="selectorType">
                  @for (t of selectorTypes; track t) { <nz-option [nzValue]="t" [nzLabel]="t"></nz-option> }
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <nz-form-item>
          <nz-form-label nzRequired>Selector</nz-form-label>
          <nz-form-control nzErrorTip="Selector is required">
            <input nz-input formControlName="selector" placeholder="button#submit" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Stable</nz-form-label>
          <nz-form-control>
            <nz-switch formControlName="isStable"></nz-switch>
          </nz-form-control>
        </nz-form-item>
      </form>
    </nz-spin>
  </ng-container>
</nz-drawer>

<ng-template #footer>
  <div style="text-align: right">
    <button nz-button (click)="close()" [disabled]="submitting()" style="margin-right: 8px">Cancel</button>
    <button nz-button nzType="primary" (click)="submit()" [nzLoading]="submitting()" [disabled]="form.invalid">
      {{ isEditing ? 'Save changes' : 'Create element' }}
    </button>
  </div>
</ng-template>
