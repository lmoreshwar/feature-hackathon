<h2 class="app-page-title">Settings</h2>
<p class="app-page-subtitle">Workspace configuration and signed-in account.</p>

<nz-card nzTitle="Account" [nzBordered]="false" class="settings-card">
  @if (user(); as profile) {
    <nz-descriptions nzBordered [nzColumn]="1" nzSize="middle">
      <nz-descriptions-item nzTitle="User ID">{{ profile._id }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="Email">{{ profile.email }}</nz-descriptions-item>
      @if (profile.createdAt) {
        <nz-descriptions-item nzTitle="Created">{{ profile.createdAt }}</nz-descriptions-item>
      }
      @if (profile.updatedAt) {
        <nz-descriptions-item nzTitle="Last updated">{{ profile.updatedAt }}</nz-descriptions-item>
      }
    </nz-descriptions>
  } @else {
    <p>No profile loaded.</p>
  }
</nz-card>

<nz-card nzTitle="Environment" [nzBordered]="false" class="settings-card">
  <nz-descriptions nzBordered [nzColumn]="1" nzSize="middle">
    <nz-descriptions-item nzTitle="Mode">
      <span nz-icon nzType="experiment" nzTheme="outline" class="env-icon"></span>
      {{ buildMode }}
    </nz-descriptions-item>
    <nz-descriptions-item nzTitle="API base URL">
      <code>{{ apiBaseUrl }}</code>
    </nz-descriptions-item>
  </nz-descriptions>
</nz-card>
